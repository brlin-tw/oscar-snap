name: oscar-snap
services:
  # Environment for testing the project
  test-environment:
    container_name: oscar-snap-test
    hostname: oscar-snap-test
    image: ubuntu:24.04
    volumes:
      - type: bind
        source: ./
        target: /project
    environment:
      # Pass host proxy settings to the container
      - http_proxy
      - HTTP_PROXY
      - https_proxy
      - HTTPS_PROXY
      - no_proxy
      - NO_PROXY

      # Set this environment variable to your local timezone settings for proper operation timestamp
      #- TZ=CST-8

      # Avoid debconf interactive prompts on Debian-like systems
      - DEBIAN_FRONTEND=noninteractive
    init: true
    command: sleep infinity
